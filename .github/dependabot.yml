# Dependabot configuration for automated dependency updates
# Constitutional Article V: Zero-Trust Security - Keep dependencies up-to-date

version: 2
updates:
  # Python dependencies for automation-collection-example
  - package-ecosystem: "pip"
    directory: "/automation-collection-example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "collection"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "platform-team"
    assignees:
      - "platform-team"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version updates for now (manual review required)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python dependencies for automation-ee-example
  - package-ecosystem: "pip"
    directory: "/automation-ee-example"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "execution-environment"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "platform-team"
    assignees:
      - "platform-team"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    reviewers:
      - "platform-team"

  # Docker (for base images in automation-ee-example)
  - package-ecosystem: "docker"
    directory: "/automation-ee-example"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "execution-environment"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "platform-team"

