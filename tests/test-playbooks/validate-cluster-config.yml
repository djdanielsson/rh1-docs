---
# Validation playbook for cluster-config repository
# Tests that all Kubernetes resources are valid
- name: Validate Cluster Configuration
  hosts: localhost
  gather_facts: false
  vars:
    cluster_config_path: "{{ playbook_dir }}/../../cluster-config"

  tasks:
    - name: Check cluster-config directory exists
      ansible.builtin.stat:
        path: "{{ cluster_config_path }}"
      register: cluster_dir

    - name: Fail if directory doesn't exist
      ansible.builtin.fail:
        msg: "cluster-config directory not found at {{ cluster_config_path }}"
      when: not cluster_dir.stat.exists

    - name: Find all YAML files
      ansible.builtin.find:
        paths: "{{ cluster_config_path }}"
        patterns: "*.yaml,*.yml"
        recurse: true
      register: yaml_files

    - name: Display found files
      ansible.builtin.debug:
        msg: "Found {{ yaml_files.files | length }} YAML files"

    - name: Validate YAML syntax
      ansible.builtin.command:
        cmd: "python3 -c 'import yaml; yaml.safe_load(open(\"{{ item.path }}\"))'"
      loop: "{{ yaml_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false

    - name: Check for required ArgoCD Application fields
      ansible.builtin.shell: |
        if grep -q "kind: Application" "{{ item.path }}"; then
          python3 -c "
import yaml
with open('{{ item.path }}') as f:
    app = yaml.safe_load(f)
    assert 'apiVersion' in app, 'Missing apiVersion'
    assert 'metadata' in app, 'Missing metadata'
    assert 'spec' in app, 'Missing spec'
    assert 'source' in app['spec'], 'Missing spec.source'
    print('✅ Valid ArgoCD Application')
          "
        fi
      args:
        executable: /bin/bash
      loop: "{{ yaml_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: "'argocd' in item.path"
      changed_when: false
      failed_when: false
      register: argocd_check

    - name: Check for secrets in YAML files
      ansible.builtin.shell: |
        if grep -iE '(password|secret|token|api[_-]?key):\s*["\']?[^{]' "{{ item.path }}" | grep -v '{{ ' | grep -v '^#' | grep -v '_name:' | grep -v 'secretRef'; then
          echo "⚠️  WARNING: Possible secret in {{ item.path | basename }}"
          exit 1
        fi
      args:
        executable: /bin/bash
      loop: "{{ yaml_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false
      failed_when: false
      register: secret_check

    - name: Report secret check results
      ansible.builtin.debug:
        msg: "{{ secret_check.results | selectattr('rc', 'equalto', 1) | list | length }} files with potential secrets"

    - name: Check namespace naming convention
      ansible.builtin.shell: |
        if [ -f "{{ item.path }}" ] && grep -q "kind: Namespace" "{{ item.path }}"; then
          name=$(python3 -c "import yaml; print(yaml.safe_load(open('{{ item.path }}'))['metadata']['name'])")
          if [[ ! "$name" =~ ^aap- ]]; then
            echo "❌ Namespace $name doesn't start with aap-"
            exit 1
          fi
          echo "✅ Namespace $name follows naming convention"
        fi
      args:
        executable: /bin/bash
      loop: "{{ yaml_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: "'namespaces' in item.path"
      changed_when: false

    - name: Validation summary
      ansible.builtin.debug:
        msg: |
          ✅ Cluster Configuration Validation Complete
      
          Files validated: {{ yaml_files.files | length }}
          YAML syntax: ✅ All valid
          ArgoCD apps: ✅ Checked
          Secrets: {{ 'none found' if (secret_check.results | selectattr('rc', 'equalto', 1) | list | length == 0) else 'warnings issued' }}
          Namespaces: ✅ Naming convention followed



