---
# Smoke test playbook for the entire platform
# Quick validation that all repositories are in good state
- name: Platform Smoke Test
  hosts: localhost
  gather_facts: true
  vars:
    workspace_root: "{{ playbook_dir }}/../.."

  tasks:
    - name: Display test information
      ansible.builtin.debug:
        msg: |
          🧪 Cloud-Native Ansible Lifecycle - Smoke Test
          ================================================
          Workspace: {{ workspace_root }}
          Date: {{ ansible_date_time.iso8601 }}

    - name: Check all repository directories exist
      ansible.builtin.stat:
        path: "{{ workspace_root }}/{{ item }}"
      loop:
        - cluster-config
        - aap-config-as-code
        - automation-collection-example
        - automation-ee-example
        - automation-release-manifest
      register: repo_dirs

    - name: Verify repositories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "Repository directory missing: {{ item.item }}"
        success_msg: "✅ {{ item.item }}"
      loop: "{{ repo_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check pre-commit configurations exist
      ansible.builtin.stat:
        path: "{{ workspace_root }}/{{ item }}/.pre-commit-config.yaml"
      loop:
        - cluster-config
        - aap-config-as-code
        - automation-collection-example
        - automation-ee-example
        - automation-release-manifest
      register: precommit_configs

    - name: Verify pre-commit configs
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'pre-commit configured ✅' if item.stat.exists else 'pre-commit missing ⚠️' }}"
      loop: "{{ precommit_configs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check GitHub workflows exist
      ansible.builtin.find:
        paths: "{{ workspace_root }}/{{ item }}/.github/workflows"
        patterns: "*.yml,*.yaml"
      loop:
        - cluster-config
        - aap-config-as-code
        - automation-collection-example
        - automation-ee-example
        - automation-release-manifest
      register: workflow_files
      failed_when: false

    - name: Display workflow counts
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.matched }} workflows"
      loop: "{{ workflow_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check documentation exists
      ansible.builtin.stat:
        path: "{{ workspace_root }}/docs/{{ item }}"
      loop:
        - PRE-COMMIT-SETUP.md
        - PRE-COMMIT-REFERENCE.md
        - CICD-GUIDE.md
        - CICD-SUMMARY.md
      register: doc_files

    - name: Verify documentation
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'exists ✅' if item.stat.exists else 'missing ⚠️' }}"
      loop: "{{ doc_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check for Python virtual environment
      ansible.builtin.stat:
        path: "~/workspace/ansible"
      register: venv_check

    - name: Python environment status
      ansible.builtin.debug:
        msg: "{{ 'Python venv configured ✅' if venv_check.stat.exists else 'Python venv not found ⚠️' }}"

    - name: Check for required tools
      ansible.builtin.command:
        cmd: "which {{ item }}"
      loop:
        - python3
        - git
        - ansible
        - ansible-galaxy
      register: tool_checks
      changed_when: false
      failed_when: false

    - name: Display tool availability
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ 'available ✅' if item.rc == 0 else 'not found ⚠️' }}"
      loop: "{{ tool_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Count total files in workspace
      ansible.builtin.find:
        paths: "{{ workspace_root }}"
        file_type: file
        recurse: true
        excludes:
          - ".git"
          - "__pycache__"
          - "*.pyc"
          - ".venv"
          - "venv"
          - "node_modules"
      register: total_files

    - name: Smoke test summary
      ansible.builtin.debug:
        msg: |
      
          🎉 Smoke Test Complete
          ======================
      
          Repositories:        5/5 ✅
          Pre-commit configs:  {{ precommit_configs.results | selectattr('stat.exists') | list | length }}/5 
          GitHub workflows:    {{ workflow_files.results | map(attribute='matched') | sum }} total
          Documentation:       {{ doc_files.results | selectattr('stat.exists') | list | length }}/{{ doc_files.results | length }}
          Required tools:      {{ tool_checks.results | selectattr('rc', 'equalto', 0) | list | length }}/{{ tool_checks.results | length }}
          Total files:         {{ total_files.matched }}
      
          Status: ✅ Platform structure is valid



