---
# Full workflow integration test
# Tests the entire GitOps workflow from development to production
- name: Full Workflow Integration Test
  hosts: localhost
  gather_facts: false
  vars:
    workspace_root: "{{ playbook_dir }}/../.."
    test_output_dir: "/tmp/ansible-lifecycle-test"

  tasks:
    - name: Create test output directory
      ansible.builtin.file:
        path: "{{ test_output_dir }}"
        state: directory
        mode: '0755'

    - name: Display test information
      ansible.builtin.debug:
        msg: |
          🧪 Full Workflow Integration Test
          ==================================
          Testing: Development → QA → Production workflow
          Output: {{ test_output_dir }}

    # ========================================================================
    # STAGE 1: DEVELOPMENT
    # ========================================================================
    - name: "STAGE 1: Development - Collection Development"
      ansible.builtin.debug:
        msg: "Testing collection development workflow..."

    - name: Build Ansible collection
      ansible.builtin.command:
        cmd: ansible-galaxy collection build --force --output-path {{ test_output_dir }}
        chdir: "{{ workspace_root }}/automation-collection-example"
      register: collection_build
      changed_when: true

    - name: Verify collection tarball created
      ansible.builtin.find:
        paths: "{{ test_output_dir }}"
        patterns: "*.tar.gz"
      register: collection_tarball

    - name: Assert collection built successfully
      ansible.builtin.assert:
        that:
          - collection_build.rc == 0
          - collection_tarball.files | length > 0
        fail_msg: "Collection build failed"
        success_msg: "✅ Collection built successfully"

    # ========================================================================
    # STAGE 2: BUILD EXECUTION ENVIRONMENT
    # ========================================================================
    - name: "STAGE 2: Build - Execution Environment"
      ansible.builtin.debug:
        msg: "Testing EE build workflow..."

    - name: Validate EE definition
      ansible.builtin.command:
        cmd: ansible-builder create --verbosity 1
        chdir: "{{ workspace_root }}/automation-ee-example"
      register: ee_validate
      changed_when: true
      failed_when: false

    - name: Clean up EE build artifacts
      ansible.builtin.file:
        path: "{{ workspace_root }}/automation-ee-example/context"
        state: absent

    - name: Assert EE definition is valid
      ansible.builtin.assert:
        that:
          - ee_validate.rc == 0
        fail_msg: "EE validation failed"
        success_msg: "✅ EE definition is valid"

    # ========================================================================
    # STAGE 3: CONFIGURATION AS CODE
    # ========================================================================
    - name: "STAGE 3: Configuration - AAP Config as Code"
      ansible.builtin.debug:
        msg: "Testing AAP configuration workflow..."

    - name: Validate inventory
      ansible.builtin.command:
        cmd: ansible-inventory -i inventory.yml --list
        chdir: "{{ workspace_root }}/aap-config-as-code"
      register: inventory_check
      changed_when: false

    - name: Parse inventory output
      ansible.builtin.set_fact:
        parsed_inventory: "{{ inventory_check.stdout | from_json }}"

    - name: Verify inventory has required groups
      ansible.builtin.assert:
        that:
          - "'all' in parsed_inventory"
        fail_msg: "Inventory validation failed"
        success_msg: "✅ Inventory is valid"

    - name: Check playbook syntax
      ansible.builtin.command:
        cmd: ansible-playbook --syntax-check playbook.yml
        chdir: "{{ workspace_root }}/aap-config-as-code"
      changed_when: false

    # ========================================================================
    # STAGE 4: RELEASE MANIFEST
    # ========================================================================
    - name: "STAGE 4: Release - Create Release Manifest"
      ansible.builtin.debug:
        msg: "Testing release manifest workflow..."

    - name: Get mock commit SHAs
      ansible.builtin.set_fact:
        mock_aap_config_sha: "0123456789abcdef0123456789abcdef01234567"
        mock_collection_sha: "abcdef0123456789abcdef0123456789abcdef01"
        mock_ee_digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

    - name: Create test release manifest
      ansible.builtin.copy:
        dest: "{{ test_output_dir }}/release-test.yaml"
        content: |
          ---
          version: "0.1.0-test"
          created: "{{ ansible_date_time.iso8601 }}"
          created_by: "integration-test"
          description: "Test release manifest"

          components:
            aap_configuration:
              repository: "https://github.com/djdanielsson/rh1-aap-config-as-code.git"
              commit: "{{ mock_aap_config_sha }}"
              branch: "main"
            
            collections:
              repository: "https://github.com/djdanielsson/rh1-custom-collection.git"
              commit: "{{ mock_collection_sha }}"
              branch: "main"
            
            execution_environment:
              registry: "quay.io"
              repository: "myorg/custom-ee"
              tag: "0.1.0-test"
              digest: "{{ mock_ee_digest }}"

          environments:
            qa:
              deployed: null
              validated: false
            prod:
              deployed: null
              validated: false

          validation:
            tests_passed: ["integration-test"]
            approval_required: true
        mode: '0644'

    - name: Validate release manifest structure
      ansible.builtin.command:
        cmd: python3 -c "import yaml; m=yaml.safe_load(open('{{ test_output_dir }}/release-test.yaml')); assert 'version' in m; assert 'components' in m; print('Manifest valid')"
      changed_when: false
      register: manifest_validation

    - name: Assert manifest is valid
      ansible.builtin.assert:
        that:
          - "'Manifest valid' in manifest_validation.stdout"
        fail_msg: "Release manifest validation failed"
        success_msg: "✅ Release manifest is valid"

    # ========================================================================
    # STAGE 5: KUBERNETES RESOURCES
    # ========================================================================
    - name: "STAGE 5: Platform - Kubernetes Resources"
      ansible.builtin.debug:
        msg: "Testing Kubernetes resource validation..."

    - name: Find all Kubernetes YAML files
      ansible.builtin.find:
        paths: "{{ workspace_root }}/cluster-config"
        patterns: "*.yaml,*.yml"
        recurse: true
      register: k8s_files

    - name: Validate YAML syntax
      ansible.builtin.command:
        cmd: python3 -c "import yaml; yaml.safe_load(open('{{ item.path }}'))"
      loop: "{{ k8s_files.files[:5] }}"  # Test first 5 files
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false

    - name: K8s validation complete
      ansible.builtin.debug:
        msg: "✅ Kubernetes resources validated"

    # ========================================================================
    # STAGE 6: SECURITY VALIDATION
    # ========================================================================
    - name: "STAGE 6: Security - Validate No Secrets"
      ansible.builtin.debug:
        msg: "Testing security compliance..."

    - name: Check for secrets in YAML files
      ansible.builtin.shell: |
        if grep -ri 'password.*:.*[^{]' {{ workspace_root }}/aap-config-as-code/group_vars/ | grep -v '{{ ' | grep -v '#' | grep -v '_name:'; then
          exit 1
        fi
        exit 0
      args:
        executable: /bin/bash
      changed_when: false
      register: secret_check

    - name: Assert no secrets found
      ansible.builtin.assert:
        that:
          - secret_check.rc == 0
        fail_msg: "Secrets detected in configuration"
        success_msg: "✅ No secrets detected"

    # ========================================================================
    # STAGE 7: CONSTITUTIONAL COMPLIANCE
    # ========================================================================
    - name: "STAGE 7: Compliance - Constitutional Checks"
      ansible.builtin.debug:
        msg: "Testing constitutional compliance..."

    - name: Verify version locking in manifest
      ansible.builtin.shell: |
        python3 -c "
import yaml
with open('{{ test_output_dir }}/release-test.yaml') as f:
    m = yaml.safe_load(f)

# Article III: Atomic Promotion
assert len(m['components']['aap_configuration']['commit']) == 40, 'Full SHA required'
assert len(m['components']['collections']['commit']) == 40, 'Full SHA required'
assert m['components']['execution_environment']['digest'].startswith('sha256:'), 'Digest required'

print('Constitutional compliance verified')
        "
      changed_when: false
      register: compliance_check

    - name: Assert constitutional compliance
      ansible.builtin.assert:
        that:
          - "'Constitutional compliance verified' in compliance_check.stdout"
        fail_msg: "Constitutional compliance check failed"
        success_msg: "✅ Constitutional compliance verified"

    # ========================================================================
    # FINAL SUMMARY
    # ========================================================================
    - name: Clean up test artifacts
      ansible.builtin.file:
        path: "{{ test_output_dir }}"
        state: absent

    - name: Full workflow test summary
      ansible.builtin.debug:
        msg: |
          
          🎉 Full Workflow Integration Test Complete
          ==========================================
          
          ✅ STAGE 1: Collection Development - PASSED
          ✅ STAGE 2: EE Build - PASSED
          ✅ STAGE 3: AAP Configuration - PASSED
          ✅ STAGE 4: Release Manifest - PASSED
          ✅ STAGE 5: Kubernetes Resources - PASSED
          ✅ STAGE 6: Security Validation - PASSED
          ✅ STAGE 7: Constitutional Compliance - PASSED
          
          All workflow stages completed successfully!
          Platform is ready for GitOps deployment.



