---
# Mock AAP configuration for testing
# Sample configuration that can be used for testing without real AAP

# Organizations
controller_organizations:
  - name: "Test Organization"
    description: "Test organization for development"
    galaxy_credentials:
      - "Ansible Galaxy"

# Teams
controller_teams:
  - name: "Dev Team"
    description: "Development team"
    organization: "Test Organization"

# Credentials
controller_credentials:
  - name: "Test Machine Credential"
    description: "Test SSH credential"
    organization: "Test Organization"
    credential_type: "Machine"
    inputs:
      username: "testuser"
      ssh_key_data: "{{ lookup('file', '/tmp/test_key') | default('MOCK_KEY', true) }}"

  - name: "Test SCM Credential"
    description: "Test Git credential"
    organization: "Test Organization"
    credential_type: "Source Control"
    inputs:
      username: "git-user"
      password: "{{ lookup('env', 'GIT_PASSWORD') | default('MOCK_PASSWORD', true) }}"

# Projects
controller_projects:
  - name: "Test Project"
    description: "Test project for validation"
    organization: "Test Organization"
    scm_type: git
    scm_url: "https://github.com/ansible/ansible-examples.git"
    scm_branch: "master"
    scm_update_on_launch: true
    scm_update_cache_timeout: 60

# Inventories
controller_inventories:
  - name: "Test Inventory"
    description: "Test inventory"
    organization: "Test Organization"
    variables:
      env: "test"

# Hosts
controller_hosts:
  - name: "test-host-01"
    inventory: "Test Inventory"
    variables:
      ansible_connection: local

# Job Templates
controller_templates:
  - name: "Test Job Template"
    description: "Test job template"
    job_type: "run"
    inventory: "Test Inventory"
    project: "Test Project"
    playbook: "hello_world.yml"
    credentials:
      - "Test Machine Credential"
    verbosity: 1
    ask_variables_on_launch: true

# Execution Environments
controller_execution_environments:
  - name: "Test EE"
    description: "Test execution environment"
    image: "quay.io/ansible/awx-ee:latest"
    organization: "Test Organization"

# Schedules
controller_schedules:
  - name: "Test Schedule"
    description: "Test schedule"
    unified_job_template: "Test Job Template"
    rrule: "DTSTART:20250101T000000Z RRULE:FREQ=DAILY;INTERVAL=1"
    enabled: false



